[package]
name = "mode-llm-advisor"
version.workspace = true
edition.workspace = true

[features]
default = ["safe/standard"]

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
safe = { path = "../safe", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "time"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
uuid = "1.23.3"

[[bin]]
name = "mode_llm_advisor"
path = "src/main.rs"
