[package]
name = "safe-gatekeeper"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.102"
rand = "0.9.4"
rand_chacha = "0.9.0"
safe = { path = "../safe" }
safe-sim = { path = "../safe-sim" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[[bin]]
name = "safe_gatekeeperd"
path = "src/main.rs"
