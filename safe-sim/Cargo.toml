[package]
name = "safe-sim"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.102"
base64 = "0.22.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
rand = "0.9.4"
rand_chacha = "0.9.0"
rand_distr = "0.5.1"
tokio = { version = "1.52.1", features = ["process", "rt", "time"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.52.1", features = ["macros"] }
