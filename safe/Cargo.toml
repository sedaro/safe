[package]
name = "safe"
version.workspace = true
edition.workspace = true

[features]
default = ["platform-safectl-json"]
otel-metrics = ["dep:opentelemetry-proto", "dep:prost"]
platform-bash-mock = []
platform-safectl-json = []

[dependencies]
anyhow = "1.0.102"
argmin = "0.10.0"
argmin-math = { version = "0.4.0", features = ["vec"] }
async-trait = "0.1.89"
base64 = { version = "0.22.1" }
bincode = "1.3"
bytes = "1.11.1"
chrono = "0.4.44"
crc = "3.4.0"
csv = { version = "1.4.0" }
figment = { version = "0.10.19", features = ["env", "json", "toml", "yaml"] }
futures = "0.3.32"
safe-time = { path = "../safe-time" }
nalgebra = { version = "0.33.2" }
opentelemetry-proto = { version = "0.31.0", optional = true }
prost = { version = "0.14.3", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
socket2 = "0.6.3"
sysinfo = "0.38.4"
tokio = { version = "1.52.1", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["codec"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.23.1", features = ["serde", "v4", "v5"] }

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"
