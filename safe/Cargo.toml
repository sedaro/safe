[package]
name = "safe"
version.workspace = true
edition.workspace = true

[features]
default = ["standard"]
eds = ["platform-safectl-json", "resource-metrics"]
env-filter = ["tracing-subscriber/env-filter"]
otel-metrics-bin = ["resource-metrics", "dep:opentelemetry-proto", "dep:prost"]
platform-bash-mock = []
platform-safectl-json = ["uuid/v4"]
resource-metrics = ["dep:sysinfo"]
standard = ["platform-safectl-json", "resource-metrics", "otel-metrics-bin", "env-filter"]

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
bincode = "1.3"
bytes = "1.11.1"
chrono = { version = "0.4.44", default-features = false, features = ["clock", "std"] }
csv = { version = "1.4.0" }
figment = { version = "0.10.19", default-features = false, features = ["env", "yaml"] }
futures-util = { version = "0.3.32", default-features = false, features = ["sink", "std"] }
safe-time = { path = "../safe-time" }
opentelemetry-proto = { version = "0.31.0", optional = true, default-features = false, features = ["gen-tonic-messages", "metrics"] }
prost = { version = "0.14.3", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sysinfo = { version = "0.38.4", optional = true, default-features = false, features = ["system"] }
tokio = { version = "1.52.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["codec"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "fmt"] }
uuid = { version = "1.23.1", default-features = false, features = ["serde", "std", "v5"] }

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"
