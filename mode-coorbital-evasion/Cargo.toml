[package]
name = "mode-coorbital-evasion"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
nalgebra = "0.33.2"
safe = { path = "../safe" }
safe-sim = { path = "../safe-sim" }
safe-telemetry = { path = "../../safe/safe-telemetry", default-features = false, features = ["model", "augmented"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"

[dev-dependencies]
uuid = { version = "1.23.1", features = ["v4"] }

[[bin]]
name = "mode_coorbital_evasion"
path = "src/main.rs"
