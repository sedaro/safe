[package]
name = "safe-llm-adapter"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait = "0.1.89"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1.52.1", features = ["io-util", "macros", "net", "rt"] }
