[package]
name = "mode-anomaly-recovery"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
safe = { path = "../safe" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.52.1", features = ["fs", "process"] }
uuid = "1.23.3"

[[bin]]
name = "mode_anomaly_recovery"
path = "src/main.rs"
